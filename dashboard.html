<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - QR Attendance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Dashboard</h1>
    <p>Welcome, <strong id="who">admin</strong>!</p>

    <p><a href="session.html">Start attendance session (QR)</a></p>
    <p><a href="attendees.html">Manage Attendees</a></p>

    <button type="button" id="logoutBtn">Log out</button>
  </main>

  <script type="module">
    import { auth, onAuthStateChanged, signOut } from "./js/firebase-init.js";

    onAuthStateChanged(auth, function (user) {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      document.getElementById("who").textContent = user.email;
    });

    document.getElementById("logoutBtn").addEventListener("click", async function () {
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
