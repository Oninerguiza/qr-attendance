<!-- scan.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check in</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .scan-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 12px 0;
      font-size: 1.1rem;
      border: 2px solid #c9b8f5;
      border-radius: 8px;
    }
    .scan-input:focus { outline: 3px solid #6d28d9; border-color: #6d28d9; }
    .hidden { display: none; }
    .notice {
      border-radius: 8px;
      padding: 12px 14px;
      margin: 12px 0;
      font-weight: 600;
      line-height: 1.4;
    }
    .notice.level1 { background: #fffbeb; border: 2px solid #f59e0b; color: #92400e; }
    .notice.level2 { background: #fff7ed; border: 2px solid #ea580c; color: #9a3412; }
    .notice.level3 { background: #fef2f2; border: 2px solid #dc2626; color: #991b1b; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Check in</h1>
    <p>Type your student ID number, then tap Check in.</p>

    <input id="studentId" class="scan-input" type="text" inputmode="numeric"
           maxlength="8" autocomplete="off" placeholder="Student ID number">
    <button id="checkInBtn">Check in</button>
    <p id="result" class="message" aria-live="polite"></p>
    <p id="notice" class="notice hidden" aria-live="polite"></p>
  </main>

  <script type="module">
    import { db, doc, setDoc, getDoc, serverTimestamp } from "./js/firebase-init.js";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("s");
    const token = params.get("t");

    const result = document.getElementById("result");
    const notice = document.getElementById("notice");
    const btn = document.getElementById("checkInBtn");
    const input = document.getElementById("studentId");
    const storageKey = "checkedIn:" + sessionId;

    function show(text, type) {
      result.textContent = text;
      result.className = "message " + (type || "");
    }

    // Shows the student's absence count and what the policy says. level 0 means nothing to show.
    function showNotice(level, absences) {
      if (!level) {
        notice.textContent = "";
        notice.className = "notice hidden";
        return;
      }
      let text = "You have " + absences + (absences === 1 ? " absence. " : " absences. ");
      if (level === 1) {
        text += "1st offense: please submit a written explanation letter to your officers.";
      } else if (level === 2) {
        text += "2nd offense: your parents or guardians will be summoned and a final warning letter will be issued. Any further absence means removal from the organization.";
      } else {
        text += "3rd offense: removal from the organization. Please see your officers.";
      }
      notice.textContent = text;
      notice.className = "notice level" + level;
    }

    function lockPage() {
      input.disabled = true;
      btn.disabled = true;
    }

    if (!sessionId || !token) {
      show("This link is incomplete. Scan the QR code on the screen again.", "error");
      lockPage();
    } else {
      // This phone already checked in for this session?
      try {
        const earlier = localStorage.getItem(storageKey);
        if (earlier) {
          show("This phone already checked in (ID " + earlier + "). Only one check-in is allowed per session.", "error");
          lockPage();
        }
      } catch (e) { /* storage unavailable, the database rules still apply */ }
    }

    async function checkIn() {
      const studentId = input.value.trim();
      if (!/^[0-9]{8}$/.test(studentId)) {
        show("Enter your 8-digit student ID number.", "error");
        return;
      }

      btn.disabled = true;
      showNotice(0, 0);
      show("Checking in...");

      try {
        // Verify the ID number is in the attendee list first
        const found = await getDoc(doc(db, "attendees", studentId));
        if (!found.exists()) {
          btn.disabled = false;
          show("ID number not found in the attendee list. Check the number and try again.", "error");
          return;
        }

        const person = found.data();

        // Blocked students cannot check in (the database rules refuse it too)
        if (person.blocked === true) {
          btn.disabled = false;
          show("This ID cannot check in right now. Please see your officers.", "error");
          return;
        }

        // The record ID is SESSION_STUDENT, so the database refuses a second check-in for the same student.
        await setDoc(doc(db, "attendance", sessionId + "_" + studentId), {
          studentId: studentId,
          sessionId: sessionId,
          token: token,
          createdAt: serverTimestamp()
        });

        try { localStorage.setItem(storageKey, studentId); } catch (e) {}
        show("You are checked in, " + person.name + ". You can close this page.", "success");
        showNotice(Number(person.offenseLevel) || 0, Number(person.absences) || 0);
        lockPage();
      } catch (error) {
        btn.disabled = false;
        if (error.code === "permission-denied") {
          show("Check-in failed. You already checked in, or the QR code expired. Scan the QR code again if it expired.", "error");
        } else {
          show("Something went wrong: " + error.message, "error");
        }
      }
    }

    btn.addEventListener("click", checkIn);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkIn(); });
  </script>
</body>
</html>
