<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login - QR Attendance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Admin login</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" id="loginBtn">Sign in</button>
    </form>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./js/firebase-init.js";

    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    function show(text, type) {
      message.textContent = text;
      message.className = "message " + (type || "");
    }

    // Already signed in? Go straight to the dashboard.
    onAuthStateChanged(auth, function (user) {
      if (user) window.location.href = "dashboard.html";
    });

    document.getElementById("loginForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      show("Signing in...");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        loginBtn.disabled = false;
        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          show("Wrong email or password.", "error");
        } else if (error.code === "auth/too-many-requests") {
          show("Too many attempts. Wait a few minutes and try again.", "error");
        } else if (error.code === "auth/operation-not-allowed") {
          show("Email/Password sign-in is not turned on in Firebase Authentication.", "error");
        } else {
          show("Could not sign in: " + error.message, "error");
        }
      }
    });
  </script>
</body>
</html>
